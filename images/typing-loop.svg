<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="300" viewBox="0 0 900 300">
  <title>Pixel-art developer typing at a laptop</title>
  <desc>The hands tap the keyboard while the laptop writes new lines of code.</desc>
  <style>
    .near-hand { animation: near-hand 1.15s step-end infinite; }
    .far-hand { animation: far-hand 1.15s step-end infinite; }
    .near-key { animation: near-key 1.15s step-end infinite; }
    .far-key { animation: far-key 1.15s step-end infinite; }
    .code-line {
      transform-box: fill-box;
      transform-origin: left center;
      animation: write-code 3.8s steps(4, end) infinite;
    }
    .cursor { animation: blink 0.9s step-end infinite; }

    @keyframes near-hand {
      0%, 28%, 62%, 100% { transform: translateY(0); }
      12%, 46% { transform: translateY(5px); }
    }
    @keyframes far-hand {
      0%, 45%, 88%, 100% { transform: translateY(0); }
      30%, 72% { transform: translateY(4px); }
    }
    @keyframes near-key {
      0%, 28%, 62%, 100% { opacity: 0; }
      12%, 46% { opacity: 0.75; }
    }
    @keyframes far-key {
      0%, 45%, 88%, 100% { opacity: 0; }
      30%, 72% { opacity: 0.75; }
    }
    @keyframes write-code {
      0%, 10% { transform: scaleX(0); opacity: 1; }
      58%, 90% { transform: scaleX(1); opacity: 1; }
      100% { transform: scaleX(1); opacity: 0; }
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .near-hand, .far-hand, .near-key, .far-key, .code-line, .cursor { animation: none; }
    }
  </style>
  <defs>
    <image id="scene" width="900" height="300" xlink:href="data:image/webp;base64," />
    <clipPath id="near-hand-area"><rect x="464" y="212" width="32" height="39" /></clipPath>
    <clipPath id="far-hand-area"><rect x="496" y="212" width="34" height="39" /></clipPath>
  </defs>
  <rect width="900" height="300" fill="#0a132d" />
  <use xlink:href="#scene" />
  <g clip-path="url(#near-hand-area)"><use class="near-hand" xlink:href="#scene" /></g>
  <g clip-path="url(#far-hand-area)"><use class="far-hand" xlink:href="#scene" /></g>
  <rect class="near-key" x="483" y="249" width="8" height="2" fill="#86efac" opacity="0" />
  <rect class="far-key" x="513" y="249" width="8" height="2" fill="#86efac" opacity="0" />
  <g class="code-line" opacity="0.75">
    <rect x="566" y="212" width="17" height="4" fill="#7dd3fc" />
    <rect x="588" y="212" width="24" height="4" fill="#86efac" />
  </g>
  <rect class="cursor" x="561" y="225" width="5" height="6" fill="#86efac" />
</svg>
